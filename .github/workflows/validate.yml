name: Validar EFG Training
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar sintaxis Python
        run: python -m py_compile app.py visuals.py
      - name: Validar el máximo móvil de cargas (sin instalar Streamlit)
        run: |
          python - <<'PY'
          import ast, json, math, pathlib
          from datetime import date, timedelta
          app = ast.parse(pathlib.Path("app.py").read_text(encoding="utf-8"))
          target = next(node for node in app.body
              if isinstance(node, ast.FunctionDef) and node.name == "monthly_maximum_weights")
          code = compile(ast.Module(body=[target], type_ignores=[]), "<maximo-movil>", "exec")
          namespace = {"date": date, "timedelta": timedelta, "math": math}
          exec(code, namespace)
          fn = namespace["monthly_maximum_weights"]
          entries = json.loads(pathlib.Path("data/plan.json").read_text(encoding="utf-8"))["entries"]
          maxima = fn(entries, [], as_of=date(2026, 10, 12))
          assert abs(maxima["extension de cuadriceps"]["kg"] / 0.45359237 - 235.0) < .1
          session = {"date": "2026-10-12", "exercise": "Extension de cuadriceps",
                     "sets": [{"kg": 120, "reps": 10}]}
          updated = fn(entries, [session], as_of=date(2026, 10, 12))
          assert abs(updated["extension de cuadriceps"]["kg"] - 120) < .001
          fallback = fn(entries, [], as_of=date(2027, 3, 15))
          assert fallback["extension de cuadriceps"]["source"] == "excel_inicial"
          print("OK: máximo móvil y actualización por sesión real")
          PY
      - name: Validar importación de la rutina
        run: |
          python - <<'PY'
          import json, pathlib
          plan = json.loads(pathlib.Path('data/plan.json').read_text(encoding='utf-8'))
          arr = plan["entries"]
          assert len(arr) == 544, len(arr)
          assert plan["weeks"] == 12
          assert [sum(r["week"]==w for r in arr) for w in range(1,13)] == [46,46,45,45,46,45,45,45,46,45,45,45]
          assert {r["day"] for r in arr} == set(range(1,6))
          assert len({r["id"] for r in arr}) == len(arr)
          assert sum(r["week"]<=4 for r in arr) == 182
          assert sum(r["week"]>=5 for r in arr) == 362
          assert not any(r.get("weekly_report") for r in arr if r["week"] >= 5)
          assert not any(r.get("reference_weight_lb") is not None for r in arr if r["week"] >= 5)
          assert sum(r["week"]==1 and r["reference_weight_lb"] is not None for r in arr) == 32
          assert any(r["reference_series_kg"] and len(r["reference_series_kg"])==4 for r in arr)
          blob = pathlib.Path('data/plan.json').read_text(encoding='utf-8').casefold()
          assert 'belutrainer' not in blob and 'rutina diseñada por' not in blob
          hist = json.loads(pathlib.Path('data/history.json').read_text(encoding='utf-8'))
          assert isinstance(hist["sessions"], list)
          weights = json.loads(pathlib.Path('data/weight.json').read_text(encoding='utf-8'))
          assert isinstance(weights["measurements"], list)
          print("OK: plan completo y sin atribución personal")
          PY
